services:
  postgres:
    image: postgres:16-alpine
    container_name: altora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: altora
      POSTGRES_PASSWORD: altora
      POSTGRES_DB: altora
    ports:
      # Host 5433 avoids clashing with a locally installed PostgreSQL on 5432.
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U altora -d altora']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
